<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午餐訂單管理後台</title>
    <style>
        body { font-family: '微軟正黑體', Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        .unpaid { background-color: #ffebee; }
        .paid { background-color: #e8f5e9; }
        .notify-badge { background-color: #ff9800; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 負責人專屬後台</h1>
    
    <div class="card">
        <h2>💰 今日訂單即時看板</h2>
        <p>目前總訂購人數：<strong id="totalCount" style="color:red; font-size: 20px;">0</strong> 人</p>
        
        <table>
            <thead>
                <tr>
                    <th>座號</th>
                    <th>餐點</th>
                    <th>備註</th>
                    <th>金額</th>
                    <th>繳費狀態 (勾選即確認)</th>
                </tr>
            </thead>
            <tbody id="orderTableBody">
                <tr><td colspan="5">連線讀取中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAQ3nCfS7eNB_hRQ2AQVBFARPn2YeJXl3c",
        authDomain: "lunch-system-cc413.firebaseapp.com",
        projectId: "lunch-system-cc413",
        storageBucket: "lunch-system-cc413.firebasestorage.app",
        messagingSenderId: "620598610406",
        appId: "1:620598610406:web:bd5e7db2b568c48d1d2e27"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tbody = document.getElementById('orderTableBody');
    const totalCount = document.getElementById('totalCount');

    // 監聽即時訂單
    onSnapshot(collection(db, "orders"), (snapshot) => {
        let orders = [];
        snapshot.forEach((docSnap) => orders.push(docSnap.data()));
        orders.sort((a, b) => a.studentId - b.studentId);
        
        totalCount.innerText = orders.length;

        if (orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="color: #888;">目前還沒有同學點餐喔！</td></tr>`;
            return;
        }

        let html = '';
        orders.forEach(order => {
            let rowClass = order.isPaid ? 'paid' : 'unpaid';
            let checkedAttr = order.isPaid ? 'checked' : '';
            
            // 功能 2：如果同學按了「我已繳費」，而且你還沒打勾，就顯示明顯的橘色 Badge 提示你
            let notifyUI = (order.notifiedPaid && !order.isPaid) ? `<br><span class="notify-badge">🙋‍♂️ 說他交錢了</span>` : '';

            html += `
                <tr class="${rowClass}">
                    <td><strong>${order.studentId}</strong> 號</td>
                    <td>${order.meal}</td>
                    <td>${order.note}</td>
                    <td>$${order.price}</td>
                    <td>
                        <input type="checkbox" ${checkedAttr} onclick="togglePaid('${order.studentId}', this.checked)" style="width:20px; height:20px;">
                        ${notifyUI}
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    });

    // 切換已繳費
    window.togglePaid = async function(studentId, isPaid) {
        try {
            await updateDoc(doc(db, "orders", "student_" + studentId), { isPaid: isPaid });
        } catch (error) { alert("更新失敗！"); }
    };
</script>
</body>
</html>
