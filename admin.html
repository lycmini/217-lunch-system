<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午餐訂單管理後台</title>
    <style>
        body {
            font-family: '微軟正黑體', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 {
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .unpaid {
            background-color: #ffebee;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 負責人專屬：午餐管理後台</h1>

    <!-- 區塊一：決定今天吃哪家 -->
    <div class="card">
        <h2>🍽️ 步驟一：設定今日餐廳</h2>
        <label for="restaurantName">餐廳名稱：</label>
        <input type="text" id="restaurantName" placeholder="例如：八方雲集">

        <label for="menuItems">輸入菜單品項 (請用逗號隔開)：</label>
        <input type="text" id="menuItems" placeholder="例如：招牌鍋貼, 韭菜水餃, 玉米濃湯">

        <button onclick="alert('之後會將設定存入資料庫！')">發布今日菜單</button>
    </div>

    <!-- 區塊二：看訂單與收錢 -->
    <div class="card">
        <h2>💰 步驟二：今日訂單統計與繳費狀況</h2>
        <p>目前總訂購人數：<strong style="color:red; font-size: 20px;">0</strong> 人</p>
        
        <table>
            <thead>
                <tr>
                    <th>座號</th>
                    <th>餐點</th>
                    <th>備註</th>
                    <th>繳費確認</th>
                </tr>
            </thead>
            <tbody>
                <!-- 這裡先放兩筆假資料當作預覽 -->
                <tr class="unpaid">
                    <td>1</td>
                    <td>招牌鍋貼</td>
                    <td>不要醬油</td>
                    <td><input type="checkbox"> 尚未繳款</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>韭菜水餃</td>
                    <td>無</td>
                    <td><input type="checkbox" checked> 已繳款</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
