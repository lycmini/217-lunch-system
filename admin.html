<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, doc, updateDoc, onSnapshot, query, where, getDocs, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAQ3nCfS7eNB_hRQ2AQVBFARPn2YeJXl3c",
        authDomain: "lunch-system-cc413.firebaseapp.com",
        projectId: "lunch-system-cc413",
        storageBucket: "lunch-system-cc413.firebasestorage.app",
        messagingSenderId: "620598610406",
        appId: "1:620598610406:web:bd5e7db2b568c48d1d2e27"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const d = new Date();
    const todayStr = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
    document.getElementById('adminDate').value = todayStr;
    document.getElementById('scheduleDate').value = todayStr;

    let currentUnsubscribe = null; 
    function listenToOrders(dateStr) {
        if(currentUnsubscribe) currentUnsubscribe();
        const q = query(collection(db, "orders"), where("date", "==", dateStr));
        currentUnsubscribe = onSnapshot(q, (snapshot) => {
            let activeOrders = [], canceledAlerts = [], paidAlerts = [];
            let totalAmount = 0, collectedAmount = 0, itemCounts = {}, unpaidStudents = [];

            snapshot.forEach((docSnap) => {
                let order = docSnap.data();
                if (order.isCancelled) { canceledAlerts.push(order); } 
                else {
                    activeOrders.push(order);
                    if (order.notifiedPaid && !order.isPaid) paidAlerts.push(order);
                    totalAmount += order.price;
                    if (order.isPaid) collectedAmount += order.price; 
                    else unpaidStudents.push(order.studentId);

                    // 💡 核心升級：支援解析「品項 x數量」的多選購物車格式
                    let cleanNote = order.note.split(" | 🚨")[0]; 
                    let mealParts = order.meal.split(", "); // 拆解多個餐點
                    
                    mealParts.forEach(m => {
                        let name = m;
                        let qty = 1;
                        let match = m.match(/(.*) x(\d+)$/); // 偵測 "餐點名 x2"
                        if(match) {
                            name = match[1];
                            qty = parseInt(match[2]);
                        }
                        
                        let itemKey = name;
                        if (cleanNote && cleanNote !== "無") itemKey += ` (${cleanNote})`;
                        itemCounts[itemKey] = (itemCounts[itemKey] || 0) + qty;
                    });
                }
            });

            // 渲染通知中心
            renderNotifications(canceledAlerts, paidAlerts);
            
            // 渲染看板與總表
            activeOrders.sort((a, b) => a.studentId - b.studentId);
            document.getElementById('totalCount').innerText = activeOrders.length;

            if (activeOrders.length === 0) {
                document.getElementById('orderTableBody').innerHTML = `<tr><td colspan="5" style="color:#888;">這天沒有紀錄。</td></tr>`;
                document.getElementById('statTotalAmount').innerText = "0";
                document.getElementById('statCollected').innerText = "0";
                document.getElementById('statUnpaidAmount').innerText = "0";
                document.getElementById('statUnpaidStudents').innerText = "無";
                document.getElementById('statItemCounts').innerHTML = "<li>無資料</li>";
                return;
            }

            document.getElementById('statTotalAmount').innerText = totalAmount;
            document.getElementById('statCollected').innerText = collectedAmount;
            document.getElementById('statUnpaidAmount').innerText = totalAmount - collectedAmount;
            
            unpaidStudents.sort((a,b) => a - b);
            document.getElementById('statUnpaidStudents').innerText = unpaidStudents.length > 0 ? unpaidStudents.join(", ") + " 號" : "全班皆已繳清！🎉";

            let itemsHtml = '';
            for (let [item, count] of Object.entries(itemCounts)) itemsHtml += `<li>${item}：<strong>${count}</strong> 份</li>`;
            document.getElementById('statItemCounts').innerHTML = itemsHtml;

            let html = '';
            activeOrders.forEach(order => {
                let inlineBadge = (order.notifiedPaid && !order.isPaid) ? `<br><span class="inline-badge">🙋‍♂️ 說他交錢了</span>` : '';
                html += `
                    <tr class="${order.isPaid ? 'paid' : 'unpaid'}">
                        <td><strong>${order.studentId}</strong> 號</td>
                        <td style="color:#1565c0; font-weight:bold;">${order.meal.replace(/, /g, '<br>')}</td>
                        <td style="font-size: 13px;">${order.note}</td>
                        <td>$${order.price}</td>
                        <td>
                            <input type="checkbox" ${order.isPaid ? 'checked' : ''} onclick="togglePaid('${order.date}_${order.studentId}', this.checked)" style="width:20px;height:20px;">
                            ${inlineBadge}
                        </td>
                    </tr>
                `;
            });
            document.getElementById('orderTableBody').innerHTML = html;
        });
    }

    function renderNotifications(c, p) {
        const nc = document.getElementById('notificationCenter');
        if(c.length === 0 && p.length === 0) { nc.style.display = 'none'; return; }
        nc.style.display = 'block';
        
        let ch = c.length > 0 ? `<strong style="color:#d32f2f;">❌ 取消訂單：</strong><br>` : '';
        c.forEach(o => ch += `<div class="notif-badge"><strong>${o.studentId} 號</strong> <button class="btn-dismiss" onclick="dismissCancel('${o.date}_${o.studentId}')">清除通知</button></div>`);
        document.getElementById('cancelNotifs').innerHTML = ch;

        let ph = p.length > 0 ? `<strong style="color:#2e7d32;">💰 繳費通知：</strong><br>` : '';
        p.forEach(o => ph += `<div class="notif-badge"><strong>${o.studentId} 號</strong> <button class="btn-confirm" onclick="togglePaid('${o.date}_${o.studentId}', true)">確認收款</button></div>`);
        document.getElementById('paidNotifs').innerHTML = ph;
    }

    listenToOrders(todayStr);
    document.getElementById('adminDate').addEventListener('change', (e) => listenToOrders(e.target.value));
    
    // (其他設定儲存、Plan B 等函式請沿用上一版，確保後台功能完整即可)
    
    // 以下為補齊的常用函式
    window.togglePaid = async function(docId, isPaid) { await updateDoc(doc(db, "orders", docId), { isPaid, notifiedPaid: false }); };
    window.dismissCancel = async function(docId) { await deleteDoc(doc(db, "orders", docId)); };
    
    // (為了節省空間，Plan B 與時間設定的 JS 可直接使用上一版的，邏輯無需變更)
</script>
