<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>217班 - 午餐點餐系統</title>
    <style>
        body {
            font-family: '微軟正黑體', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
            font-size: 24px;
        }
        .status-box {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
        }
        .status-box input {
            width: 65%;
            display: inline-block;
            margin-right: 2%;
        }
        .status-box button {
            width: 30%;
            display: inline-block;
            background-color: #2196f3;
            margin-top: 0;
        }
        .restaurant-info {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        label.section-title {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            background-color: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #eee;
            cursor: pointer;
        }
        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        .submit-btn {
            background-color: #ff9800;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
        }
        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .receipt-box {
            display: none; 
            background: #fff3e0; 
            border: 2px dashed #ff9800; 
            text-align: center;
        }
        .price-text {
            color: #d32f2f;
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
        }
        .cash-warning {
            color: #d32f2f;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍱 217班 午餐點餐系統</h1>

    <div class="card status-box">
        <label for="checkId" class="section-title" style="margin-top:0;">🔍 查詢我的訂單與繳費狀態：</label>
        <input type="number" id="checkId" min="1" max="28" placeholder="輸入座號">
        <button id="checkBtn" onclick="checkStatus()">查詢</button>
    </div>
    
    <div class="card" id="orderFormArea">
        <div class="restaurant-info">
            📢 今日餐廳：麵朝 (新竹食品店)
        </div>

        <label for="studentId" class="section-title">👤 你的座號 (1-28)：</label>
        <input type="number" id="studentId" min="1" max="28" placeholder="請輸入座號">

        <label for="mealSelect" class="section-title">🍜 選擇餐點：</label>
        <select id="mealSelect">
            <option value="" data-price="0">-- 請選擇 --</option>
            <optgroup label="拌麵類">
                <option value="鮮蝦雲吞拌麵" data-price="110">鮮蝦雲吞拌麵 $110</option>
                <option value="椒麻雞絲拌麵" data-price="85">椒麻雞絲拌麵 $85</option>
            </optgroup>
            <optgroup label="湯麵類">
                <option value="羅宋蔬菜湯麵" data-price="75">羅宋蔬菜湯麵 $75</option>
                <option value="剝皮辣椒雞湯麵" data-price="140">剝皮辣椒雞湯麵 $140</option>
            </optgroup>
            <optgroup label="湯品與小點">
                <option value="新竹貢丸湯" data-price="40">新竹貢丸湯 $40</option>
                <option value="紅油鮮蝦抄手" data-price="100">紅油鮮蝦抄手 $100</option>
            </optgroup>
        </select>

        <label class="section-title">📝 客製化選項 (可複選)：</label>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="optNoodle"> +15元 享加麵服務</label>
            <label class="checkbox-item"><input type="checkbox" id="optChicken"> +30元 拌麵類加舒肥雞</label>
            <label class="checkbox-item"><input type="checkbox" id="optPork"> 湯麵雞腿 改豬肉片 (免費)</label>
        </div>

        <label for="orderNote" class="section-title">💡 其他不影響價格的需求：</label>
        <input type="text" id="orderNote" placeholder="例如：不要蔥、不要香菜...">

        <button class="submit-btn" id="submitBtn" onclick="submitOrder()">確認送出訂單</button>
    </div>

    <div class="card receipt-box" id="receiptArea">
        <h2>✅ 訂單已成功送出！</h2>
        <hr>
        <p>座號：<strong id="r_id"></strong></p>
        <p>餐點：<strong id="r_meal"></strong></p>
        <p>備註：<strong id="r_note"></strong></p>
        
        <div class="price-text">應付總額：$<span id="r_price"></span></div>
        
        <p class="cash-warning">⚠️ 請務必於今日中午前<br>將「現金」交給負責人！</p>
        <p style="font-size: 14px; color: #555;">(繳費後，可於上方輸入座號查詢是否已成功登記)</p>
        
        <button class="submit-btn" style="background-color: #757575;" onclick="location.reload()">返回重整</button>
    </div>
</div>

<!-- Firebase 雲端資料庫連線與邏輯 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // 你的專屬 Firebase 金鑰
    const firebaseConfig = {
        apiKey: "AIzaSyAQ3nCfS7eNB_hRQ2AQVBFARPn2YeJXl3c",
        authDomain: "lunch-system-cc413.firebaseapp.com",
        projectId: "lunch-system-cc413",
        storageBucket: "lunch-system-cc413.firebasestorage.app",
        messagingSenderId: "620598610406",
        appId: "1:620598610406:web:bd5e7db2b568c48d1d2e27",
        measurementId: "G-FFPSM04FM9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 查詢繳費狀態功能
    window.checkStatus = async function() {
        const id = document.getElementById('checkId').value;
        const btn = document.getElementById('checkBtn');
        
        if(!id) {
            alert("請先輸入座號！");
            return;
        }

        btn.innerText = "查詢中...";
        try {
            const docRef = doc(db, "orders", "student_" + id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.isPaid) {
                    alert(`✅ 座號 ${id}：你已經完成繳費囉！放心等著吃午餐吧！`);
                } else {
                    alert(`⚠️ 座號 ${id}：你有點餐（${data.meal}），但負責人【尚未確認收款】。\n請記得盡快將 $${data.price} 現金交給負責人喔！`);
                }
            } else {
                alert(`🔍 座號 ${id}：目前系統裡沒有你的訂單，你今天是不是還沒點餐？`);
            }
        } catch (error) {
            console.error(error);
            alert("查詢失敗，請檢查網路連線。");
        }
        btn.innerText = "查詢";
    }

    // 點餐送出功能
    window.submitOrder = async function() {
        const studentId = document.getElementById('studentId').value;
        const mealSelect = document.getElementById('mealSelect');
        const mealName = mealSelect.options[mealSelect.selectedIndex].text;
        const mealPrice = mealSelect.options[mealSelect.selectedIndex].getAttribute('data-price');
        
        if(!studentId || mealPrice == "0") {
            alert("請確實填寫座號並選擇餐點！");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "訂單傳送中...";
        btn.disabled = true;

        let finalPrice = parseInt(mealPrice);
        let notesArray = [];

        if(document.getElementById('optNoodle').checked) { finalPrice += 15; notesArray.push("加麵"); }
        if(document.getElementById('optChicken').checked) { finalPrice += 30; notesArray.push("加舒肥雞"); }
        if(document.getElementById('optPork').checked) { notesArray.push("改豬肉片"); }
        
        const customNote = document.getElementById('orderNote').value;
        if(customNote.trim() !== '') { notesArray.push(customNote.trim()); }
        
        const finalNoteString = notesArray.length > 0 ? notesArray.join(", ") : "無";

        try {
            // 正式把資料寫入雲端 Firebase
            await setDoc(doc(db, "orders", "student_" + studentId), {
                studentId: parseInt(studentId),
                meal: mealName,
                note: finalNoteString,
                price: finalPrice,
                isPaid: false // 剛點完餐，預設為未繳費
            });

            // 成功後顯示收據
            document.getElementById('orderFormArea').style.display = 'none';
            document.getElementById('receiptArea').style.display = 'block';
            document.getElementById('r_id').innerText = studentId;
            document.getElementById('r_meal').innerText = mealName;
            document.getElementById('r_note').innerText = finalNoteString;
            document.getElementById('r_price').innerText = finalPrice;
            
        } catch (error) {
            console.error(error);
            alert("送出失敗！請檢查網路連線。");
            btn.innerText = "確認送出訂單";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
